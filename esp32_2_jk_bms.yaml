# =====================================================================
#  UN SEUL ESP32 POUR DEUX BMS JK  /  ONE ESP32 FOR TWO JK BMS
#  Chaine YouTube "Alf Fait Maison"
#  Base : esp32-ble-example.yaml de syssi/esphome-jk-bms
#  (https://github.com/syssi/esphome-jk-bms), licence Apache 2.0.
#  FICHIER MODIFIE / MODIFIED FILE : 2 BMS sur 1 ESP32, prefixe B2,
#  surveillance BLE, signal Bluetooth, resistances des cellules.
#  Inspire de la video 126 du Profes'Solaire
#  (https://www.youtube.com/watch?v=ZjxKqJwwoc8)
# =====================================================================
# =====================================================================
#  ESP32 BATTERIES - ESP32-WROOM-32U (antenne externe IPEX / u.FL)
#  Lecture de 2 JK-BMS (JK_PB2A16S20P, hw V19A) en Bluetooth
# =====================================================================
#  NOUVEAUTES par rapport a la version precedente :
#   - Logger en INFO au lieu de DEBUG (moins de charge processeur)
#   - Capteurs "signal Bluetooth" de chaque BMS (pour regler l'antenne)
#   - Reglages "number" retires (moins de memoire utilisee,
#     les reglages restent modifiables dans l'appli JK)
#   - Resistances des 16 cellules REMISES pour les 2 BMS (13/10/2026)
#   - Les noms des capteurs utilises par Home Assistant sont INCHANGES
#     (power, current, state of charge, total voltage...)
# =====================================================================

substitutions:
  name: jk-bms
  device_description: "Monitor and control a JK-BMS via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  # JK_PB2A16S20P hardware V19A -> JK02_32S
  protocol_version: JK02_32S

esphome:
  name: esp32-batterie-1
  friendly_name: ESP32 BATTERIE 1

# ESP32-WROOM-32U = carte "esp32dev". Rien a declarer pour l'antenne :
# le module 32U n'a que la prise externe, elle est utilisee d'office.
esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

# Rien a renseigner : le Wi-Fi vient des secrets crees par ESPHome a la creation
# de l'appareil. / Nothing to fill in: Wi-Fi comes from the secrets ESPHome
# created with the device.
# Optionnel / optional : chiffrement de l'API (voir LISEZMOI / see README)
api:

# Ne PAS ajouter "power_save_mode: none" : le Wi-Fi et le Bluetooth
# partagent la meme radio et ont besoin du mode par defaut pour cohabiter.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32 BATTERIES Fallback
    password: !secret wifi_password

captive_portal:

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - switch.turn_off: ble_client_switch1
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: INFO

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: "XX:XX:XX:XX:XX:01"   # adresse Bluetooth du BMS 1 / Bluetooth address of BMS 1
    id: client0
  - mac_address: "XX:XX:XX:XX:XX:02"   # adresse Bluetooth du BMS 2 / Bluetooth address of BMS 2
    id: client1

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 10s
    id: bms0
  - ble_client_id: client1
    protocol_version: ${protocol_version}
    throttle: 10s
    id: bms1

# Surveillance : si un BMS est hors ligne depuis 3 min,
# on coupe puis on relance sa connexion Bluetooth
interval:
  - interval: 1min
    then:
      - if:
          condition:
            for:
              time: 3min
              condition:
                binary_sensor.is_off: bms0_online
          then:
            - logger.log: "BMS 1 hors ligne depuis 3 min -> reconnexion BLE"
            - switch.turn_off: ble_client_switch0
            - delay: 5s
            - switch.turn_on: ble_client_switch0
      - if:
          condition:
            for:
              time: 3min
              condition:
                binary_sensor.is_off: bms1_online
          then:
            - logger.log: "BMS 2 hors ligne depuis 3 min -> reconnexion BLE"
            - switch.turn_off: ble_client_switch1
            - delay: 5s
            - switch.turn_on: ble_client_switch1

binary_sensor:
  - platform: status
    name: "ESP32 BMS en ligne"

  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balancing:
      name: "balancing"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    heating:
      name: "heating"
    online_status:
      name: "online status"
      id: bms0_online

  - platform: jk_bms_ble
    jk_bms_ble_id: bms1
    balancing:
      name: "B2 balancing"
    charging:
      name: "B2 charging"
    discharging:
      name: "B2 discharging"
    heating:
      name: "B2 heating"
    online_status:
      name: "B2 online status"
      id: bms1_online

button:
  - platform: restart
    name: "ESP32 BMS redemarrer"

  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    retrieve_settings:
      name: "retrieve settings"
    retrieve_device_info:
      name: "retrieve device info"

  - platform: jk_bms_ble
    jk_bms_ble_id: bms1
    retrieve_settings:
      name: "B2 retrieve settings"
    retrieve_device_info:
      name: "B2 retrieve device info"

sensor:
  # --- Diagnostic ESP32 ---
  - platform: wifi_signal
    name: "ESP32 BMS signal Wi-Fi"
    update_interval: 60s
  - platform: uptime
    name: "ESP32 BMS uptime"

  # NOUVEAU : force du signal Bluetooth de chaque BMS
  # (proche de 0 = bon ; -70 dBm = correct ; en dessous de -85 dBm = trop faible)
  - platform: ble_client
    type: rssi
    ble_client_id: client0
    name: "BMS 1 signal Bluetooth"
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: client1
    name: "BMS 2 signal Bluetooth"
    update_interval: 60s

  # --- Batterie 1 ---
